show_dashboard:
  target:
    entity:
      integration: pleatview
      domain: media_player
  fields:
    path:
      required: true
      example: /lovelace/cameras
      selector:
        text:
    duration:
      example: 60
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box

show_url:
  target:
    entity:
      integration: pleatview
      domain: media_player
  fields:
    url:
      required: true
      example: https://embed.windy.com/embed2.html
      selector:
        text:
          type: url
    mode: &mode
      selector:
        select:
          translation_key: mode
          options:
            - fullscreen
            - pip
    position: &position
      selector:
        select:
          translation_key: position
          options:
            - top-left
            - top-right
            - bottom-left
            - bottom-right
            - center
    size: &size
      example: 35
      selector:
        number:
          min: 10
          max: 100
          unit_of_measurement: "%"
          mode: slider
    duration: &duration
      example: 30
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box

show_camera:
  target:
    entity:
      integration: pleatview
      domain: media_player
  fields:
    camera:
      required: true
      selector:
        entity:
          domain: camera
    mode: *mode
    position: *position
    size: *size
    duration: *duration
    title:
      selector:
        text:

notify:
  target:
    entity:
      integration: pleatview
      domain: media_player
  fields:
    message:
      required: true
      example: Someone is at the front door
      selector:
        text:
          multiline: true
    title:
      example: Doorbell
      selector:
        text:
    image:
      example: /local/doorbell.jpg
      selector:
        text:
    camera:
      selector:
        entity:
          domain: camera
    duration:
      example: 15
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
    position: *position

home:
  target:
    entity:
      integration: pleatview
      domain: media_player

reload:
  target:
    entity:
      integration: pleatview
      domain: media_player

forget_sign_ins:
  target:
    entity:
      integration: pleatview
      domain: media_player
  fields:
    site:
      example: https://grafana.example.com
      selector:
        text:
